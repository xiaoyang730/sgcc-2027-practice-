<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0f766e" />
    <meta name="description" content="2027年国家电网公共与行业知识背题与刷题工具" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" href="./icon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="./styles.css" />
    <title>2027国网刷题</title>
  </head>
  <body>
    <div class="app-shell">
      <header class="topbar">
        <button id="backButton" class="icon-button hidden" type="button" aria-label="返回">←</button>
        <div class="brand" id="homeButton" role="button" tabindex="0">
          <span class="brand-mark">电</span>
          <div>
            <strong>2027 国网刷题</strong>
            <small>公共与行业知识 · 832题</small>
          </div>
        </div>
        <button id="statsButton" class="icon-button" type="button" aria-label="学习统计">统计</button>
      </header>

      <main id="app" aria-live="polite">
        <section class="loading-card">
          <div class="spinner"></div>
          <p>正在载入题库…</p>
        </section>
      </main>

      <footer>
        <span>学习记录仅保存在当前浏览器</span>
        <button id="dataButton" class="text-button" type="button">备份与恢复</button>
      </footer>
    </div>

    <input id="importInput" type="file" accept="application/json,.json" hidden />
    <div id="toast" class="toast" role="status" aria-live="polite"></div>
    <script src="./app.js" defer></script>
  </body>
</html>
